; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200

; Prototype: clear saved sessions (and all other flash data) on every USB upload.
; Ordinary resets/power cycles still retain NVS history.
upload_protocol = esptool
extra_scripts = post:scripts/erase_on_upload.py

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
    https://github.com/7semi-solutions/7Semi-BMI270.git
