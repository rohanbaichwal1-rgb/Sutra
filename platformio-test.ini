; Host-side state-machine tests only. Firmware builds use platformio.ini.
[platformio]
default_envs = native
src_dir = lib/RmssdReferences
test_dir = test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++11
    -I lib/RmssdReferences
test_filter = test_references
