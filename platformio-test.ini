; Host-side state-machine tests only. Firmware builds use platformio.ini.
[platformio]
default_envs = native
src_dir = lib
test_dir = test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++11
    -I lib/RmssdReferences
    -I lib/HapticPatterns
    -I lib/HapticArray
    -I lib/PersonalBaseline
    -I lib/PdrObserver
    -I lib/TelemetryReport
    -I lib/BeatRecovery
build_src_filter =
    +<RmssdReferences/*.cpp>
    +<HapticPatterns/*.cpp>
    +<HapticArray/*.cpp>
    +<PersonalBaseline/*.cpp>
    +<PdrObserver/*.cpp>
    +<TelemetryReport/*.cpp>
test_filter = test_*
